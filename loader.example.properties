#
# Annotated example configuration for dbloader.
#
# The real one (loader.properties) has production hosts and paths in it; this
# is the same file with everything explained and pointed at a local server.
# Every section is one database connection plus whatever that stage needs.
#
# NOTE the ETS password is stored in plain text in the production file. If that
# matters, keep the config out of the repo and mode 0600 -- there is no
# indirection for it in the code.
#

# Where psql and pg_dump are, if not on $PATH.  Also settable as $PSQL and
# $PG_DUMP.  Needed wherever PostgreSQL is installed under /usr/pgsql-NN/bin.
#
#[tools]
#psql = /usr/pgsql-10/bin/psql
#pg_dump = /usr/pgsql-10/bin/pg_dump

# The NMR-STAR dictionary.  This schema is what says which tables the entries
# go into, so it has to be loaded before them.
#
# (The `engine` option the Python 2 version needed here is gone with starobj --
# there is one driver now, psycopg2, and it is not configurable.)
#
[dictionary]
database = bmrb
host = localhost
#port = 5432
user = bmrb
# read-only user granted select on everything this stage loads
rouser = web
password =
schema = dict

# Name of the DDL script, inside the directory given with -d/--dictdir.
# Optional: defaults to dictionary.sql.  That file is generated by
# nmr-star-dictionary-scripts, which is why it is named rather than found.
#
#ddlfile = dictionary.sql

# The macromolecule archive.  entrydir holds one bmr<ID>/ directory per entry,
# each containing bmr<ID>_3.str.  The *_mapfile options are the hand-maintained
# JSON name maps used by the post-load fixups.
#
[macromolecules]
database = bmrb
host = localhost
user = bmrb
rouser = web
password =
schema = macromolecules
entrydir = /websites/www/ftp/pub/bmrb/entry_directories

# cs_stats.sql and the three JSON name maps ship with dbloader and default to
# the copies in this checkout -- see loader/datafiles.py, and
# `python loader/datafiles.py -c <config>` to print what a config resolves.
# Set these only to point somewhere else; a relative path is taken from the
# top of the checkout.
#
#csstats = cs_stats.sql
#software_mapfile = software.js
#software_authors_mapfile = swauthors.js
#task_mapfile = task.js

# The metabolomics archive: bms[et]<ID>/bms[et]<ID>.str.  Unlike the
# macromolecule tables these get real column types from the dictionary.
#
[metabolomics]
database = bmrb
host = localhost
user = bmrb
rouser = web
password =
schema = metabolomics
entrydir = /websites/www/ftp/pub/bmrb/metabolomics/entry_directories

# Chem comps are dumped out of a separate database (src*) that also holds
# unreleased ones, and loaded into this one.
#
[chemcomps]
srcdatabase = ccdb
srchost = octopus
srcuser = web
#srcport = 5432
#srcpassword =
database = bmrb
host = localhost
user = bmrb
rouser = web
password =
schema = chemcomps

# Chemical-shift statistics and the website's lookup tables.  This only works
# if `web` is a schema in the same database as `macromolecules`: cs_stats.sql
# reads the macromolecule tables directly, and hardcodes both schema names.
#
[web]
database = bmrb
host = localhost
user = bmrb
rouser = web
password =
schema = web

# Both ship with dbloader and default to this checkout.  csvfiles is split on
# whitespace; each file is loaded into <schema>.<table> per its filename, e.g.
# web.termlist.csv -> web.termlist.
#
#ddlfile = webschema.sql
#csvfiles = web.pulsefilelist.csv
#    web.termlist.csv

# Where the seven `\copy` lines at the end of cs_stats.sql write the published
# statistics.  Unset, they go to /projects/BMRB/public/ftp/... by absolute
# path -- right in production, and a failure anywhere else.
#
#csstats_outdir = /path/to/statistics

# The entry tracking database -- read-only, and on its own server.  Supplies
# the released-ID list the macromolecule load checks against, the processing
# queue, and the BMRB-PDB ID map.
#
[ets]
database = ETS
user = ets
host = ets.bmrb.wisc.edu
password =

# Metabolomics extras: static CSVs named meta.<table>.csv.
#
[meta]
database = bmrb
host = localhost
user = bmrb
rouser = web
password =
schema = meta

# both ship with dbloader and default to this checkout
#
#csvdir = metabolomics_meta_files
#ddlfile = metabolomics_meta_schema.sql

# Only used by `csvio --load` (loading a whole dumped directory back).
#
#[bmrbeverything]
#database = bmrbeverything
#host = localhost
#user = bmrb
